<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>ツアマス ランダム編成</title>
</head>
<body>
<main class="app">
<header class="app-header"><h1>ツアマス ランダム編成</h1><button id="filterButton" class="filter-button" type="button">フィルター</button></header>
<section class="card filters">
<div><h2>ジャンル</h2><div id="genreFilters" class="checks"></div></div>
<div><h2>レア度</h2><div id="rarityFilters" class="checks"></div></div>
</section>
<button id="randomButton" class="random-button" type="button">ランダム編成</button>
<section id="result" aria-live="polite"><div class="empty-message">「ランダム編成」を押してください</div></section>
</main>

<div id="filterModal" class="modal" aria-hidden="true">
 <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
  <div class="modal-header"><h2 id="filterTitle">フィルター</h2><button id="filterClose" class="icon-button" type="button" aria-label="閉じる">×</button></div>
  <div class="modal-scroll">
   <section class="filter-section"><h3>楽曲選出条件</h3><div id="songModeOptions" class="radio-group"></div><div id="songFilterDetails"></div></section>
   <section class="filter-section"><h3>アイドル選出条件</h3><div id="idolModeOptions" class="radio-group"></div><div id="idolFilterDetails"></div></section>
   <section class="filter-section"><h3>衣装条件</h3><div id="costumeModeOptions" class="radio-group"></div><div id="costumeFilterDetails"></div></section>
  </div>
  <div class="modal-actions"><button id="filterReset" class="secondary-button" type="button">リセット</button><button id="filterApply" class="primary-button" type="button">フィルターを適用</button></div>
 </div>
</div>

<div id="idolPicker" class="modal" aria-hidden="true">
 <div class="modal-panel picker-panel" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="modal-header"><h2 id="pickerTitle">アイドルを選択</h2><button id="idolPickerClose" class="icon-button" type="button" aria-label="閉じる">×</button></div>
  <div class="picker-body"><input id="idolSearch" class="search-input" type="search" placeholder="アイドル名・シリーズで検索"><div id="idolPickerList" class="idol-picker-list"></div></div>
 </div>
</div>

<script src="script.js"></script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));}</script>
</body>
</html>
